name: Shell checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n scripts/*.sh
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh
      - name: Smoke tests (mock iptables)
        run: sudo bash tests/test.sh
